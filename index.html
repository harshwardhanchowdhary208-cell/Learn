<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Search</title>
  <style>
    body {
      margin: 30px;
      font-family: Arial, sans-serif;
    }

    img {
      width: 220px;
      height: 160px;
      object-fit: cover;
      margin: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pixel pulse</h1>
    <p>Search for pictures and find a little inspiration.</p>
    <p>anything</p>
  </header>

  <main>
    <form action="#" method="get">
      <label for="search">Search images:</label>
      <input id="search" type="search" name="q" placeholder="Try nature or travel">
      <button type="submit">Search</button>
    </form>

    <h2>Sample images</h2>
    <section aria-label="Sample image results">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=500&amp;q=80" alt="Mountain lake">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=500&amp;q=80" alt="Sunlight in a forest">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=500&amp;q=80" alt="Mountain landscape">
      <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&amp;fit=crop&amp;w=500&amp;q=80" alt="Modern building">
    </section>
  </main>
</body>
</html>
